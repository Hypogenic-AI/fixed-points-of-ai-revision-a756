idea:
  title: Fixed Points of AI Revision
  domain: artificial_intelligence
  hypothesis: 'If we iteratively feed a paper to an AI for review, then provide both
    the review and the paper to the AI to make revisions, and repeat this process,
    will the process converge to a fixed point where further iterations produce no
    changes?

    '
  background:
    description: 'Suppose we feed a paper to AI for reviewing, and then feed the review
      and the paper to ask AI to make revisions, and repeat this process. Will we
      ever reach a fixed point?

      '
